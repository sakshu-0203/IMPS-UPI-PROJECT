<header class="top-header">

  <!-- LEFT -->
  <div class="header-left">

    <div class="header-brand">

      <span class="brand-name">
        Allianza
      </span>

      <span class="brand-module">
        IMPS Operations
      </span>

    </div>

  </div>


  <!-- SEARCH -->
  <div class="header-search">

    <i
      class="bi bi-search"
      aria-hidden="true">
    </i>

    <input
      type="text"
      placeholder="Search Transaction ID, RRN, Mobile"
      aria-label="Search transactions"
    />

  </div>


  <!-- RIGHT -->
  <div class="header-right">

    <!-- SYSTEM STATUS -->
    <div class="system-status">

      <span class="status-dot"></span>

      <span>
        System Operational
      </span>

    </div>


    <div class="header-divider"></div>


    <!-- USER MENU -->
    <div
      class="user-menu"
      [class.open]="profileOpen">

      <button
        type="button"
        class="user-section"
        aria-haspopup="true"
        [attr.aria-expanded]="profileOpen"
        (click)="toggleProfile()">

        <div class="user-avatar">
          {{ userName.charAt(0).toUpperCase() }}
        </div>

        <div class="user-details">

          <strong>
            {{ userName }}
          </strong>

          <span>
            {{ userRole }}
          </span>

        </div>

        <i
          class="bi"
          [class.bi-chevron-down]="!profileOpen"
          [class.bi-chevron-up]="profileOpen"
          aria-hidden="true">
        </i>

      </button>


      <!-- PROFILE DROPDOWN -->
      <div
        class="profile-dropdown"
        *ngIf="profileOpen">

        <div class="profile-dropdown-header">

          <div class="dropdown-avatar">
            {{ userName.charAt(0).toUpperCase() }}
          </div>

          <div>

            <strong>
              {{ userName }}
            </strong>

            <span>
              {{ userRole }}
            </span>

          </div>

        </div>


        <div class="dropdown-divider"></div>


        <button
          type="button"
          class="dropdown-item logout-item"
          (click)="openLogoutConfirmation($event)">

          <i
            class="bi bi-box-arrow-right"
            aria-hidden="true">
          </i>

          <span>
            Logout
          </span>

        </button>

      </div>

    </div>

  </div>

</header>


<!-- =========================
     LOGOUT CONFIRMATION MODAL
     ========================= -->

<div
  class="logout-overlay"
  *ngIf="logoutModalOpen"
  (click)="closeLogoutModalFromBackdrop($event)"
  role="presentation">

  <section
    class="logout-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="logout-title"
    (click)="$event.stopPropagation()">

    <div class="logout-icon">

      <i
        class="bi bi-box-arrow-right"
        aria-hidden="true">
      </i>

    </div>


    <div class="logout-content">

      <h2 id="logout-title">
        Logout
      </h2>

      <p>
        Are you sure you want to logout?
      </p>

    </div>


    <div class="logout-actions">

      <button
        type="button"
        class="cancel-button"
        (click)="cancelLogout($event)">

        Cancel

      </button>


      <button
        type="button"
        class="confirm-logout-button"
        (click)="confirmLogout($event)">

        Logout

      </button>

    </div>

  </section>

</div>
